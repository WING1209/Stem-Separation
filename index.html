<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>6パート音源分離アプリ</title>
  <style>
    :root {
      --bg-color: #181a20;
      --card-bg: #2b303c;
      --card-hover: #353b4a;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --accent: #38bdf8;
      --btn-primary: #3b4252;
      --btn-primary-active: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    #app {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    h1 {
      font-size: 1.25rem;
      text-align: center;
      margin-bottom: 4px;
      font-weight: 700;
    }

    /* ファイルドロップ / 選択エリア */
    .upload-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px 16px;
      border: 2px dashed var(--accent);
      border-radius: 12px;
      background-color: rgba(56, 189, 248, 0.08);
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .upload-box:hover,
    .upload-box.dragover {
      background-color: rgba(56, 189, 248, 0.18);
    }

    .upload-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .upload-sub {
      font-size: 0.85rem;
      color: var(--text-sub);
      word-break: break-all;
    }

    input[type="file"] {
      display: none;
    }

    /* 実行ボタン */
    #runBtn {
      width: 100%;
      padding: 15px;
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      background-color: var(--btn-primary-active);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s, background-color 0.2s;
    }

    #runBtn:hover:not(:disabled) {
      opacity: 0.9;
    }

    #runBtn:disabled {
      background-color: var(--btn-primary);
      color: var(--text-sub);
      cursor: not-allowed;
    }

    /* ステータスバー */
    #status {
      background-color: var(--card-bg);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      color: var(--text-main);
      line-height: 1.4;
    }

    /* 6パート出力リスト */
    .stem-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stem-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      padding: 12px 16px;
      border-radius: 10px;
      border-left: 6px solid #64748b;
    }

    .stem-item.drums  { border-left-color: #f97316; }
    .stem-item.bass   { border-left-color: #eab308; }
    .stem-item.other  { border-left-color: #a855f7; }
    .stem-item.vocals { border-left-color: #ec4899; }
    .stem-item.guitar { border-left-color: #22c55e; }
    .stem-item.piano  { border-left-color: #06b6d4; }

    .stem-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .stem-num {
      font-size: 1.05rem;
      opacity: 0.9;
    }

    .dl-btn {
      padding: 7px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #ffffff;
      background-color: #0284c7;
      border-radius: 6px;
      text-decoration: none;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .dl-btn:hover:not(.disabled) {
      background-color: #0369a1;
    }

    .dl-btn.disabled {
      background-color: #3f4654;
      color: #7c8596;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>6パート音源分離 (Demucs)</h1>

    <label class="upload-box" id="dropZone" for="audioFile">
      <div class="upload-title">音声ファイルを選択 / ドロップ</div>
      <div class="upload-sub" id="fileSub">対応形式: MP3 / WAV (44100Hz・ステレオへ自動変換)</div>
      <input type="file" id="audioFile" accept=".mp3,.wav,audio/mpeg,audio/wav" />
    </label>

    <button id="runBtn" disabled>6 パート分離を実行</button>

    <div id="status">MP3 または WAV ファイルを選択してください。</div>

    <div class="stem-list">
      <div class="stem-item drums">
        <div class="stem-info"><span class="stem-num">①</span> ドラム (Drums)</div>
        <a id="dl-drums" class="dl-btn disabled">WAV 保存</a>
      </div>
      <div class="stem-item bass">
        <div class="stem-info"><span class="stem-num">②</span> ベース (Bass)</div>
        <a id="dl-bass" class="dl-btn disabled">WAV 保存</a>
      </div>
      <div class="stem-item other">
        <div class="stem-info"><span class="stem-num">③</span> その他 (Other)</div>
        <a id="dl-other" class="dl-btn disabled">WAV 保存</a>
      </div>
      <div class="stem-item vocals">
        <div class="stem-info"><span class="stem-num">④</span> ボーカル (Vocals)</div>
        <a id="dl-vocals" class="dl-btn disabled">WAV 保存</a>
      </div>
      <div class="stem-item guitar">
        <div class="stem-info"><span class="stem-num">⑤</span> ギター (Guitar)</div>
        <a id="dl-guitar" class="dl-btn disabled">WAV 保存</a>
      </div>
      <div class="stem-item piano">
        <div class="stem-info"><span class="stem-num">⑥</span> ピアノ (Piano)</div>
        <a id="dl-piano" class="dl-btn disabled">WAV 保存</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
